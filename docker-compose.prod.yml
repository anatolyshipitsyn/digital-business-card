# ------------------------------------------------------------------------------------------------
# Production overrides. Layered on top of docker-compose.yml, never used on its own:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base file is the development environment: watch mode over a bind-mounted working tree. This
# file turns it into the deployment — the built runtime image, no source mount, the loopback
# binding — and inverts the variables: `:?` makes Compose refuse to start rather than quietly bring
# production up on the local development password. Nothing is defaulted here, and no value is
# written into the file.
#
# The values come from the repository's GitHub environment — Settings → Environments → Staging —
# and reach the deploy as ordinary process environment variables. What that environment has to
# hold for the overrides below:
#
#   POSTGRES_USER      variable
#   POSTGRES_PASSWORD  secret
#   POSTGRES_DB        variable
#
# POSTGRES_PASSWORD is unconstrained: the connection string is assembled in the application, in
# src/config/namespaces/database-url.ts, which percent-encodes each part. Reserved characters —
# `@`, `:`, `/`, `#`, `?` — are safe there, where a Compose-built URL would have parsed them as a
# different host and database and failed only here, since local development never leaves `card`.
#
# The environment currently holds none of them, so a deploy stops at the first `:?` until they are
# created.
#
# There is no DATABASE_URL. The database is a service in this same file rather than a managed
# instance, so the three variables above already describe it, and a fourth holding the string whole
# would only add a way for the two to disagree. POSTGRES_HOST and POSTGRES_PORT point the client at
# a database outside the compose network — but only the client: `db` still starts and `app` still
# waits for it, so actually leaving means deleting that service and the `depends_on` in the base
# file, which is an edit to these files and not a variable.
#
# PORT keeps its default unless the host wants another one.
# ------------------------------------------------------------------------------------------------

x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER:?required in production, set it in the GitHub environment}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required in production, set it in the GitHub environment}
  POSTGRES_DB: ${POSTGRES_DB:?required in production, set it in the GitHub environment}

services:
  db:
    environment: *postgres-credentials

  app:
    build:
      target: runtime
    # The same merge key the base file uses, applied again here. The guards do not depend on it:
    # Compose interpolates the `x-` block above whether or not a service references it, so a
    # missing value aborts the start either way and the base file's `${POSTGRES_USER:-card}`
    # fallbacks are unreachable while that block exists. What this buys is that the client names
    # the guarded definitions itself instead of inheriting defaulted ones — server and client read
    # one definition, and removing the guards is then a change that shows up in both places rather
    # than one that quietly leaves production on the local development password.
    environment:
      <<: *postgres-credentials
      NODE_ENV: production
    # Cleared rather than merged: Compose would otherwise keep the base file's bind mount over the
    # image's own /app. The watch command needs no reset — it is the dev stage's CMD, and this
    # service builds the runtime stage instead.
    volumes: !reset []
    # `!override` for the same reason: Compose appends port mappings across files, so without it
    # the base file's 0.0.0.0 binding would survive alongside this one and the application would
    # still answer from outside the host. The VPS terminates TLS in a reverse proxy, so the only
    # thing that may reach the container directly is that proxy, over loopback.
    ports: !override
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
